name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  EB_APPLICATION_NAME: cmtr-a6jp15cu-app
  EB_ENVIRONMENT_NAME: cmtr-a6jp15cu-env

jobs:
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Code ──────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Configure AWS Credentials ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Set Version Label ───────────────────────────────
      - name: Set deployment version
        id: version
        run: |
          VERSION="v-${{ github.run_number }}-${{ github.sha }}"
          # Trim to 100 chars max (EB limit)
          VERSION="${VERSION:0:100}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      # ── 4. Get S3 Bucket Name ─────────────────────────────
      - name: Get S3 bucket name
        id: s3bucket
        run: |
          BUCKET="elasticbeanstalk-${{ env.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "BUCKET_NAME=${BUCKET}" >> $GITHUB_OUTPUT
          echo "Using S3 bucket: ${BUCKET}"

      # ── 5. Create Deployment ZIP ──────────────────────────
      - name: Create deployment package
        run: |
          zip -r deploy-package.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "*.md"
          echo "Package size: $(du -sh deploy-package.zip)"

      # ── 6. Upload ZIP to S3 ───────────────────────────────
      - name: Upload package to S3
        run: |
          aws s3 cp deploy-package.zip \
            s3://${{ steps.s3bucket.outputs.BUCKET_NAME }}/github-deployments/deploy-${{ steps.version.outputs.APP_VERSION }}.zip
          echo "✅ Uploaded to S3"

      # ── 7. Create EB Application Version ─────────────────
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label "${{ steps.version.outputs.APP_VERSION }}" \
            --source-bundle \
              S3Bucket=${{ steps.s3bucket.outputs.BUCKET_NAME }},S3Key=github-deployments/deploy-${{ steps.version.outputs.APP_VERSION }}.zip \
            --description "GitHub Actions Run #${{ github.run_number }}" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Application version created"

      # ── 8. Deploy to EB Environment ───────────────────────
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label "${{ steps.version.outputs.APP_VERSION }}" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Deployment triggered"

      # ── 9. Wait for Environment Ready ─────────────────────
      - name: Wait for deployment to complete
        run: |
          echo "Polling environment status..."
          MAX=25
          COUNT=0

          while [ $COUNT -lt $MAX ]; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name ${{ env.EB_APPLICATION_NAME }} \
              --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Environments[0].Status' \
              --output text)

            HEALTH=$(aws elasticbeanstalk describe-environments \
              --application-name ${{ env.EB_APPLICATION_NAME }} \
              --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Environments[0].Health' \
              --output text)

            echo "[$COUNT/$MAX] Status: $STATUS | Health: $HEALTH"

            if [ "$STATUS" = "Ready" ]; then
              echo "✅ Environment is Ready!"
              break
            fi

            COUNT=$((COUNT + 1))
            sleep 20
          done

          if [ $COUNT -eq $MAX ]; then
            echo "❌ Timed out waiting for environment"
            exit 1
          fi

      # ── 10. Verify Application ────────────────────────────
      - name: Verify deployment
        run: |
          ENV_URL=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Environments[0].CNAME' \
            --output text)

          echo "🌐 App URL: http://${ENV_URL}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${ENV_URL})
          RESPONSE=$(curl -s http://${ENV_URL})

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${RESPONSE}"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment verified successfully!"
          else
            echo "❌ Verification failed - HTTP ${HTTP_CODE}"
            exit 1
          fi

      # ── 11. Print Summary ─────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          ENV_URL=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Environments[0].CNAME' \
            --output text)

          echo "## Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ env.EB_APPLICATION_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.EB_ENVIRONMENT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.APP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | http://${ENV_URL} |" >> $GITHUB_STEP_SUMMARY